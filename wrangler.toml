# Cloudflare Pages project config for Vinted Studio.
# Frontend: static Vite build in dist/. API: Pages Functions in functions/.
# Bindings: D1 (metadata + thumbnails) and R2 (full image blobs).
name = "vinted-studio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# --- D1: metadata rows + inline thumbnails ---
[[d1_databases]]
binding = "DB"
database_name = "vinted-studio"
database_id = "44f49bb5-2c1f-4d99-b2c4-2fff9cba267a"
migrations_dir = "migrations"

# --- R2: full image binaries only (key = images/{imageId}) ---
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vinted-studio-images"
